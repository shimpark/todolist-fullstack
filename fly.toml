# fly.toml - Fly.io deployment configuration for TsProject Backend
app = "tsproject-backend"
primary_region = "nrt" # 도쿄 리전 (한국에서 가장 빠름)

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ASPNETCORE_HTTP_PORTS = "8080"
  DB_CONNECTION_STRING = "Data Source=/data/todos.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "todo_data"
  destination = "/data"
  initial_size = "1gb"
